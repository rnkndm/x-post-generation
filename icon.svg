<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1f22"/>
      <stop offset="0.55" stop-color="#0a0b0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="feather" x1="4" y1="16" x2="18.5" y2="3.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d63a8"/>
      <stop offset="0.45" stop-color="#1d9bf0"/>
      <stop offset="0.75" stop-color="#5ec1ff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.85" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.55" stdDeviation="0.45" flood-color="#001522" flood-opacity="0.55"/>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="24" height="24" rx="5.4"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="24" height="24" rx="5.4" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="24" height="24" fill="url(#vignette)"/>
    <rect x="0" y="0" width="24" height="24" fill="url(#sheen)"/>
    <rect x="0.15" y="0.15" width="23.7" height="23.7" rx="5.25" fill="none" stroke="url(#rim)" stroke-width="0.3"/>

    <g opacity="0.35" filter="url(#softglow)">
      <path d="M18.5 10.5a5 5 0 0 0-7.07-7.07L6 8.86V16h7.14z" fill="none" stroke="#1d9bf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#dropshadow)">
      <path d="M18.5 10.5a5 5 0 0 0-7.07-7.07L6 8.86V16h7.14z" fill="none" stroke="url(#feather)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="13.5" y1="6.5" x2="4" y2="16" stroke="url(#feather)" stroke-width="1.55" stroke-linecap="round"/>
      <line x1="14.5" y1="12" x2="8" y2="12" stroke="url(#feather)" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
